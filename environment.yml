# CADD-Toolbox Environment Configuration
# 推荐使用mamba创建环境以获得更好的性能:
#   mamba env create -f environment.yml
# 
# 如果未安装mamba，请先安装:
#   conda install mamba -n base -c conda-forge
#
# 或使用conda (较慢):
#   conda env create -f environment.yml --solver=libmamba

name: CADD-Toolbox
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - pytorch
dependencies:
  # Python版本
  - python=3.10
  
  # CUDA Runtime支持（根据系统CUDA版本选择）
  - cuda-cudart  # 自动选择兼容版本
  - cudatoolkit
  
  # 首先安装RAPIDS基础依赖
  - libucxx=0.44.*
  - ucxx=0.44.*
  
  # 核心科学计算库
  - numpy
  - pandas
  - scipy
  - scikit-learn
  
  # RAPIDS库（按依赖顺序）
  - cudf=24.02.*
  - cuml=24.02.*
  
  # 机器学习框架
  - pytorch
  - torchvision
  
  # GPU计算库
  - cupy
  - faiss-gpu
  
  # 分子计算和化学信息学
  - rdkit
  - openmm=8.2.0
  
  # 可视化库
  - matplotlib
  - seaborn
  - plotly
  - altair
  
  # Web应用框架
  - streamlit
  
  # 数据处理和并行计算
  - tqdm
  - numba
  - psutil
  - dask
  
  # 聚类分析
  - hdbscan
  
  # 文件处理
  - pyarrow
  - h5py
  
  # 配置和工具
  - pyyaml
  - requests
  - pillow
  - jinja2
  
  # 降维和机器学习工具（conda管理）
  - umap-learn
  
  # 系统监控和工具
  - psutil
  - watchdog
  
  # 系统依赖
  - pip
  - setuptools
  - wheel
  
  # 仅保留conda无法安装的pip包
  - pip:
      # 日志和调试
      - loguru==0.7.3
      
      # GPU监控（NVIDIA专用）
      - nvidia-ml-py==12.570.86
      - pynvml
      
      # 快速字符串匹配
      - rapidfuzz==3.13.0
      
      # 安全张量序列化
      - safetensors==0.5.3
      
      # 机器学习数据类型
      - ml-dtypes
