name: CADD-Toolbox
channels:
  - conda-forge
  - pytorch
  - nvidia
  - rapidsai
  - defaults
dependencies:
  - python=3.10
  - pip
  
  # 核心科学计算库
  - numpy
  - pandas
  - scipy
  - scikit-learn
  
  # 分子计算库
  - rdkit
  
  # 可视化库
  - matplotlib
  - seaborn
  - plotly
  - altair
  
  # Web框架和数据处理工具
  - streamlit
  - tqdm
  - psutil
  - hdbscan
  - umap-learn
  - watchdog
  
  # 文件处理和配置库
  - pyarrow
  - h5py
  - pyyaml
  - requests
  - pillow
  - jinja2
  
  # PyTorch (CPU版本，适合GitHub Actions)
  - pytorch
  - torchvision
  - cpuonly
  
  # FAISS (CPU版本)
  - faiss-cpu
  
  # 纯Python包
  - loguru=0.7.3
  - rapidfuzz=3.13.0
  - safetensors=0.5.3
  - ml_dtypes=0.5.*
  
  # 额外的工具包
  - openpyxl>=3.1.0
  - xlsxwriter>=3.1.0
  
  - pip:
    - streamlit-aggrid>=0.3.4
    - stmol>=0.0.9
    - nvidia-ml-py==12.575.51 