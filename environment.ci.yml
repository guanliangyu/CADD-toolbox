name: CADD-Toolbox-CI
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10.18
  - pip=25.2

  # Core scientific stack
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.7.2

  # Chemistry
  - rdkit=2025.03.6

  # Visualization
  - matplotlib=3.10.6
  - seaborn=0.13.2
  - plotly=6.3.0
  - altair=5.5.0

  # App/runtime
  - streamlit=1.49.1
  - tqdm=4.67.1
  - psutil=7.1.0
  - hdbscan=0.8.39
  - umap-learn=0.5.9.post2
  - watchdog=6.0.0

  # File/config handling
  - pyarrow=19.0.1
  - h5py=3.14.0
  - pyyaml=6.0.2
  - requests=2.32.5
  - pillow=11.3.0
  - jinja2=3.1.6

  # CPU-only ML stack for CI runners
  - pytorch=2.5.1
  - torchvision=0.20.1
  - cpuonly
  - faiss-cpu=1.9.0

  # Utility packages
  - loguru=0.7.3
  - rapidfuzz=3.13.0
  - safetensors=0.5.3
  - ml_dtypes=0.5.1
