name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install "ruff==0.15.4" "black==24.2.0"

      - name: Ruff (style/lint)
        run: ruff check .

      - name: Black (formatting)
        run: black --check --diff .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "1.5.7"
          cache-environment: true
          environment-file: environment.ci.yml
          environment-name: cadd-toolbox

      - name: Environment info
        shell: bash -l {0}
        run: |
          micromamba info
          python --version

      - name: Smoke tests
        shell: bash -l {0}
        run: |
          python test_environment.py
          python -c "from rdkit import Chem; print('RDKit available')"
          python -c "import streamlit; print('Streamlit available')"
          python -m py_compile Home.py
          find pages -name '*.py' -print0 | xargs -0 python -m py_compile

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: |
          pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
